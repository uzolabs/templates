name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repo:
    name: Shared files and template rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run sync:check
      - run: npm run check

  template:
    name: ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add each template here as it lands. "contracts: false" skips the Foundry and Hardhat steps.
        include:
          - template: token
            contracts: true
          - template: nft
            contracts: true
          - template: dex-integration
            contracts: false
    defaults:
      run:
        working-directory: ${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ${{ matrix.template }}/package-lock.json
            ${{ matrix.template }}/frontend/package-lock.json
      - uses: foundry-rs/foundry-toolchain@v1
        if: matrix.contracts
      - name: Install (also installs frontend/ via postinstall)
        run: npm ci
      - run: npm run typecheck
      - name: Script tests
        if: ${{ !matrix.contracts }}
        run: npm test
      - name: Foundry build and test
        if: matrix.contracts
        run: |
          forge build
          forge test -vv
      - name: Hardhat build and test
        if: matrix.contracts
        run: |
          npx hardhat build
          npx hardhat test solidity
      - name: Frontend ABI is up to date
        if: matrix.contracts
        run: |
          npx tsx scripts/export-abi.ts
          git diff --exit-code -- frontend/src/abi.ts
      - name: Frontend build
        run: npm --prefix frontend run build
